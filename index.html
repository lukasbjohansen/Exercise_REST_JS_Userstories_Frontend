<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR music records</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://unpkg.com/vue@3.0.11/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.js"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>
    <div id="app">
        <div class="container">
            <h1 class="display-4">DR Music Records</h1>
            <table v-if="records.length > 0" class="table table-sm">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Artist</th>
                        <th>Duration</th>
                        <th>Year</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="record in records">
                        <td>{{ record.title }}</td>
                        <td>{{ record.artist }}</td>
                        <td v-if="record.duration > 59">
                            {{ Math.floor(record.duration / 60) }}:{{ String(record.duration % 60).padStart(2, '0') }}
                        </td>
                        <td v-else>
                            0:{{ String(record.duration).padStart(2, '0') }}
                        </td>
                        <td>{{ record.publicationYear }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
